  <script>
    window.printTicket = function(data) {
      if (!data) return;
      console.log('Impression du ticket:', data);
      const printWindow = window.open('', '_blank');
      const ticketNum = data.ticketNumber || data.ticket_number || data.id || '---';
      const patient = data.patientName || data.patient_name || 'Anonyme';
      const service = data.serviceName || data.service_name || 'Consultation';

      printWindow.document.write(`
        <html><head><title>TICKET - O'CLIC SANTE</title>
        <style>
          body { font-family: 'Courier New', monospace; width: 80mm; padding: 20px; font-size: 14px; text-align: center; }
          .header { border-bottom: 2px dashed #000; margin-bottom: 15px; padding-bottom: 15px; }
          .num { font-size: 40px; font-weight: bold; margin: 15px 0; }
          .footer { border-top: 2px dashed #000; margin-top: 15px; padding-top: 15px; font-size: 11px; }
        </style></head>
        <body onload="window.print(); window.close();">
          <div class="header">
            <h1 style="margin:0; font-size:20px;">O'CLIC SANTE</h1>
            <p style="margin:5px 0;">Centre Médical Dakar</p>
          </div>
          <div class="num">${ticketNum}</div>
          <div style="text-align:left; margin:20px 0;">
            <div style="margin-bottom:8px;"><strong>PATIENT:</strong> ${patient}</div>
            <div style="margin-bottom:8px;"><strong>SERVICE:</strong> ${service}</div>
            <div style="margin-bottom:8px;"><strong>DATE:</strong> ${new Date().toLocaleString()}</div>
          </div>
          <div class="footer">
            <p>MERCI DE VOTRE CONFIANCE</p>
            <p style="font-weight:bold;">VOTRE SANTE, NOTRE PRIORITE</p>
          </div>
        </body></html>
      `);
      printWindow.document.close();
    };
    
    // Alias pour la compatibilité avec tous les composants
    window.printDocument = window.printTicket;
  </script>
