<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad1)" stroke="#1e40af" stroke-width="1"/>
  
  <!-- Medical cross -->
  <rect x="13" y="7" width="6" height="18" rx="1" fill="white"/>
  <rect x="7" y="13" width="18" height="6" rx="1" fill="white"/>
  
  <!-- Heart pulse -->
  <path d="M 8 20 Q 10 18, 12 20 T 16 20 Q 18 18, 20 20 T 24 20" 
        stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- O'CLIC text -->
  <text x="16" y="28" font-family="Arial, sans-serif" font-size="4" font-weight="bold" 
        text-anchor="middle" fill="white">O'CLIC</text>
</svg>
